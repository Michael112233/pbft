syntax = "proto3";

package pbft.transport.v1;

option go_package = "github.com/michael112233/pbft/transportpb;transportpb";

import "google/protobuf/timestamp.proto";

message ViewID {
  uint64 generation = 1;
  uint64 counter = 2;
}

enum TriggerMode {
  TRIGGER_MODE_PERIODIC = 0;
  TRIGGER_MODE_PERFORMANCE = 1;
  TRIGGER_MODE_FIXED = 2;
  TRIGGER_MODE_NULL = 3;
}

enum Policy {
  POLICY_ROUND_ROBIN = 0;
  POLICY_ELECTION = 1;
}

message Action {
  TriggerMode trigger_mode = 1;
  Policy policy = 2;
}

message Transaction {
  string sender = 1;
  string receiver = 2;
  string amount = 3;
}

message ClientMsg {
  int64 id = 1;
  google.protobuf.Timestamp timestamp = 2;
  Transaction txn = 3;
  string client_name = 4;
  string padding = 5;
}

message ClientMsgReply {
  int64 id = 1;
  google.protobuf.Timestamp timestamp = 2;
  Transaction txn = 3;
  string client_name = 4;
}

message ClientMsgSignature {
  ClientMsg data = 1;
  bytes signature = 2;
}

message RequestMessage {
  repeated ClientMsgSignature txs = 1;
  string msg_type = 2;
}

message EventMsg {
  string event_type = 1;
}

// ClientBatchDigestPayload is the canonical protobuf representation hashed for
// a batch. Client signatures are deliberately excluded and verified
// separately.
message ClientBatchDigestPayload {
  repeated ClientMsg client_msgs = 1;
}

message VCRunningStatus {
  repeated ClientMsgSignature txs = 1;
  bool vc_running = 2;
}

message PreprepareMsg {
  ViewID view = 1;
  int64 seq_num = 2;
  repeated ClientMsgSignature client_msg = 3;
  reserved 4;
  bytes digest_client_msg = 5;
  repeated bytes digest_individual_client_msgs = 6;
}

message PreprepareSignPayload {
  ViewID view = 1;
  int64 seq_num = 2;
  bytes digest_client_msg = 3;
  reserved 4;
}

message PrepareMsg {
  ViewID view = 1;
  int64 seq_num = 2;
  bytes digest = 3;
  int32 from = 4;
  reserved 5;
}

message CommitMsg {
  ViewID view = 1;
  int64 seq_num = 2;
  bytes digest = 3;
  int32 from = 4;
  reserved 5;
}

message PreprepareMsgMini {
  ViewID view = 1;
  int64 seq_num = 2;
  bytes digest_client_msg = 3;
  repeated bytes digest_individual_client_msgs = 4;
}

message PreprepareMsgSig {
  PreprepareMsgMini preprepare_msg_mini = 1;
  bytes signature = 2;
  repeated ClientMsgSignature actual_msg = 3;
}

message PrepareMsgSig {
  PrepareMsg prepare_msg = 1;
  bytes signature = 2;
}

message ReplyMessage {
  string to = 1;
  string from = 2;
  ClientMsg client_msg = 3;
  bool success = 4;
  string error = 5;
  int64 executed_seq_num = 6;
}

message CommitTps {
  string to = 1;
  string from = 2;
  ClientMsgReply client_msg = 3;
}

message LeaderIdUpdate {
  string to = 1;
  string from = 2;
  int32 new_leader_id = 3;
  ViewID view = 4;
}

message CloseMessage {
  int64 timestamp = 1;
  string from = 2;
  string to = 3;
}

message CheckpointMsg {
  int64 seq_num = 1;
  bytes digest = 2;
  int32 from = 3;
}

message CheckpointMsgSig {
  CheckpointMsg checkpoint_msg = 1;
  bytes signature = 2;
}

message PreparedCert {
  PreprepareMsgSig preprepare_msg = 1;
  map<int32, PrepareMsgSig> prepare_log = 2;
}

message ViewChangeMsg {
  ViewID view_number = 1;
  int64 checkpoint_seq_number = 2;
  int32 from = 3;
  map<int64, PreparedCert> prepared_certs = 4;
  Action action = 5;

  bytes checkpoint_digest = 9;
  repeated CheckpointMsgSig checkpoint_proof = 10;
  map<string, string> checkpoint_balances = 11;
}

message ViewChangeMsgSig {
  ViewChangeMsg view_change_msg = 1;
  bytes signature = 2;
}

message NewViewMsg {
  repeated PreprepareMsgSig preprepare_log = 1;
  repeated ViewChangeMsgSig view_change_log = 2;
  ViewID new_view_number = 3;
  int32 from = 4;
  double throughput = 5;
}

message NewViewMsgSig {
  NewViewMsg new_view_msg = 1;
  bytes signature = 2;
}

message RequestVoteMsg {
  int32 from = 1;
  ViewID view_number = 2;
  bytes seed = 3;
  uint64 delay_steps = 4;
  bytes y = 5;
  bytes vdf_proof = 6;
  bytes vrf_proof = 7;
}

message RequestVoteMsgSig {
  RequestVoteMsg request_vote_msg = 1;
  bytes signature = 2;
}

message GrantVoteMsg {
  int32 from = 1;
  ViewID view_number = 2;
}

message GrantVoteMsgSig {
  GrantVoteMsg grant_vote_msg = 1;
  bytes signature = 2;
}

message EpochData {
  double throughput = 1;
  double proposal_interval = 2;
  uint32 inactive_nodes = 3;
  double vc_rate = 4;
}

message EpochDataMsg {
  uint64 epoch_generation = 1;
  int32 from = 2;
}

message EpochDataMsgSig {
  EpochDataMsg epoch_data_msg = 1;
  bytes signature = 2;
}

message EpochAggregateMsgMini {
  uint64 epoch_generation = 1;
  int32 from = 2;
  EpochData epoch_data = 3;
  Action current_action = 4;
}

message EpochAggregateMsg {
  uint64 epoch_generation = 1;
  int32 from = 2;
  EpochData epoch_data = 3;
  repeated EpochDataMsgSig epoch_data_msg_sigs = 4;
  Action current_action = 5;
}

message Envelope {
  string msg_type = 1;
  int32 from = 2;
  bytes signature = 3;

  oneof body {
    RequestMessage request = 10;
    PreprepareMsg preprepare = 11;
    PrepareMsg prepare = 12;
    CommitMsg commit = 13;
    ReplyMessage reply = 14;
    CloseMessage close = 15;
    ViewChangeMsg view_change = 16;
    NewViewMsg new_view = 18;
    CheckpointMsg checkpoint = 19;
    CommitTps commit_tps = 20;
    LeaderIdUpdate leader_id_update = 21;
    VCRunningStatus vc_running_status = 22;
    RequestVoteMsg request_vote = 23;
    GrantVoteMsg grant_vote = 24;
    EventMsg event = 25;
    EpochDataMsg epoch_data = 26;
    EpochAggregateMsg epoch_aggregate = 27;
  }
}

message Ack {
  bool ok = 1;
  string error = 2;
}

service PBFTTransport {
  rpc Deliver(Envelope) returns (Ack);
  rpc ClientNodeChannel(stream Envelope) returns (stream Envelope);
}
