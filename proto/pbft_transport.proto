syntax = "proto3";

package pbft.transport.v1;

option go_package = "github.com/michael112233/pbft/transportpb;transportpb";

import "google/protobuf/timestamp.proto";

message Transaction {
  string sender = 1;
  string receiver = 2;
  string amount = 3;
}

message ClientMsg {
  int64 id = 1;
  google.protobuf.Timestamp timestamp = 2;
  Transaction txn = 3;
  string client_name = 4;
  string padding = 5;
}

message ClientMsgReply {
  int64 id = 1;
  google.protobuf.Timestamp timestamp = 2;
  Transaction txn = 3;
  string client_name = 4;
}

message ClientMsgSignature {
  ClientMsg data = 1;
  bytes signature = 2;
}

message RequestMessage {
  repeated ClientMsgSignature txs = 1;
  string msg_type = 2;
}

// ClientBatchDigestPayload is the canonical protobuf representation hashed for
// a batch. Client signatures are deliberately excluded and verified
// separately.
message ClientBatchDigestPayload {
  repeated ClientMsg client_msgs = 1;
}

message VCRunningStatus {
  repeated ClientMsgSignature txs = 1;
  bool vc_running = 2;
}

message PreprepareMsg {
  int64 view = 1;
  int64 seq_num = 2;
  repeated ClientMsgSignature client_msg = 3;
  reserved 4;
  bytes digest_client_msg = 5;
  repeated bytes digest_individual_client_msgs = 6;
}

message PreprepareSignPayload {
  int64 view = 1;
  int64 seq_num = 2;
  bytes digest_client_msg = 3;
  reserved 4;
}

message PrepareMsg {
  int64 view = 1;
  int64 seq_num = 2;
  bytes digest = 3;
  int32 from = 4;
  reserved 5;
}

message CommitMsg {
  int64 view = 1;
  int64 seq_num = 2;
  bytes digest = 3;
  int32 from = 4;
  reserved 5;
}

message PreprepareMsgMini {
  int64 view = 1;
  int64 seq_num = 2;
  bytes digest_client_msg = 3;
  repeated bytes digest_individual_client_msgs = 4;
}

message PreprepareMsgSig {
  PreprepareMsgMini preprepare_msg_mini = 1;
  bytes signature = 2;
  ClientMsgSignature actual_msg = 3;
}

message PrepareMsgSig {
  PrepareMsg prepare_msg = 1;
  bytes signature = 2;
}

message ReplyMessage {
  string to = 1;
  string from = 2;
  ClientMsg client_msg = 3;
  bool success = 4;
  string error = 5;
  int64 executed_seq_num = 6;
}

message CommitTps {
  string to = 1;
  string from = 2;
  ClientMsgReply client_msg = 3;
}

message LeaderIdUpdate {
  string to = 1;
  string from = 2;
  int32 new_leader_id = 3;
  int64 view = 4;
}

message CloseMessage {
  int64 timestamp = 1;
  string from = 2;
  string to = 3;
}

message Envelope {
  string msg_type = 1;
  int32 from = 2;
  bytes signature = 3;

  oneof body {
    RequestMessage request = 10;
    PreprepareMsg preprepare = 11;
    PrepareMsg prepare = 12;
    CommitMsg commit = 13;
    ReplyMessage reply = 14;
    CloseMessage close = 15;
    CommitTps commit_tps = 20;
    LeaderIdUpdate leader_id_update = 21;
    VCRunningStatus vc_running_status = 22;
  }
}

message Ack {
  bool ok = 1;
  string error = 2;
}

service PBFTTransport {
  rpc Deliver(Envelope) returns (Ack);
  rpc ClientNodeChannel(stream Envelope) returns (stream Envelope);
}
